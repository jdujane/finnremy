<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mom's Pink Island 🌸</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#1a0010;}
canvas{display:block;width:100vw;height:100vh;}
#hud{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:10;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:5px;}
#counter{background:rgba(50,0,25,.75);backdrop-filter:blur(8px);border:1px solid rgba(255,145,190,.4);color:#ffe0f0;padding:5px 16px;border-radius:18px;font-size:12px;font-family:Georgia,serif;}
#msg{background:rgba(50,0,25,.75);backdrop-filter:blur(8px);border:1px solid rgba(255,145,190,.4);color:#ffd0e8;padding:4px 12px;border-radius:14px;font-size:10px;font-family:Georgia,serif;display:none;max-width:460px;text-align:center;}
/* inside UI */
#inside-ui{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;display:none;z-index:12;}
#room-nav{position:absolute;bottom:50%;left:0;right:0;transform:translateY(50%);display:flex;justify-content:space-between;padding:0 4px;pointer-events:all;}
.nav-btn{background:rgba(50,0,25,.8);border:1px solid rgba(255,140,185,.4);color:#ffb8d8;width:32px;height:56px;border-radius:8px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.nav-btn:disabled{opacity:.25;pointer-events:none;}
#room-badge{position:absolute;top:10px;left:12px;background:rgba(50,0,25,.75);border:1px solid rgba(255,140,185,.4);color:#ffb8d8;padding:4px 10px;border-radius:10px;font-size:10px;font-family:Georgia,serif;}
#top-right{position:absolute;top:10px;right:10px;display:flex;gap:5px;pointer-events:all;}
.tr-btn{background:rgba(50,0,25,.8);border:1px solid rgba(255,140,185,.45);color:#ffd0e8;padding:4px 10px;border-radius:10px;font-size:10px;font-family:Georgia,serif;cursor:pointer;}
.tr-btn.active{background:rgba(180,50,100,.7);border-color:#ffb8d8;color:#fff;}
/* craft panel */
#craft-wrap{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:98vw;max-width:720px;background:rgba(30,0,15,.88);backdrop-filter:blur(10px);border:1px solid rgba(255,130,175,.38);border-radius:14px;padding:6px 10px;display:flex;flex-direction:column;align-items:center;gap:5px;pointer-events:all;}
#mats{color:#e8d890;font-size:10px;font-family:Georgia,serif;}
#cat-row{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;}
.cat-btn{background:rgba(100,25,55,.4);border:1px solid rgba(255,120,165,.3);color:#ffcce0;padding:2px 7px;border-radius:7px;font-size:9px;font-family:Georgia,serif;cursor:pointer;}
.cat-btn.on{background:rgba(190,55,110,.7);border-color:#ffaac8;color:#fff;}
#items-row{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-height:80px;overflow-y:auto;}
.item-btn{background:rgba(120,28,62,.35);border:1px solid rgba(255,120,165,.38);color:#ffe0f0;padding:3px 7px;border-radius:7px;font-size:9px;font-family:Georgia,serif;cursor:pointer;white-space:nowrap;}
.item-btn:hover{background:rgba(195,58,110,.6);}
.item-btn.sel{border-color:#ffb8d8;background:rgba(195,55,108,.72);}
.item-btn.dim{opacity:.35;pointer-events:none;}
/* win */
#win{position:fixed;inset:0;background:rgba(15,0,8,.96);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;z-index:30;}
#win h1{font-size:28px;color:#ffb6d9;margin-bottom:14px;font-family:Georgia,serif;}
#win p{font-size:14px;line-height:1.9;max-width:320px;color:#ffd6ec;font-family:Georgia,serif;}
#win .er{font-size:28px;margin:12px 0;}
#play-again{margin-top:18px;background:linear-gradient(135deg,#c0407a,#e0609a);border:none;color:#fff;padding:9px 24px;border-radius:18px;font-size:12px;cursor:pointer;font-family:Georgia,serif;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div id="counter">🌸 0/8</div><div id="msg"></div></div>
<div id="inside-ui">
  <div id="room-nav">
    <button class="nav-btn" id="nav-l">◀</button>
    <button class="nav-btn" id="nav-r">▶</button>
  </div>
  <div id="room-badge">Living Room</div>
  <div id="top-right">
    <button class="tr-btn active" id="mode-craft">🛠 Craft</button>
    <button class="tr-btn" id="mode-move">↔ Move</button>
    <button class="tr-btn" id="mode-del">🗑 Delete</button>
    <button class="tr-btn" id="exit-btn">🚪 Exit</button>
  </div>
  <div id="craft-wrap">
    <div id="mats">🪵 0 wood · 🌿 0 cotton</div>
    <div id="cat-row"></div>
    <div id="items-row"></div>
  </div>
</div>
<div id="win">
  <div class="er">🏡🌸💕🛋💖</div>
  <h1>Your Home is Beautiful!</h1>
  <p>Happy Mother's Day, Mom.<br><br>Every corner was built with love — just like you fill ours every day. Thank you for everything. 💕</p>
  <button id="play-again">Play Again</button>
</div>
<script>
const C=document.getElementById('c'),ctx=C.getContext('2d');
function resize(){C.width=innerWidth;C.height=innerHeight;}
resize();addEventListener('resize',()=>{resize();if(phase!=='inside')buildWorld();});
let W,H,frame=0,won=false,phase='flowers';
const keys={},mouse={x:0,y:0};

// ── OUTSIDE ──────────────────────────────────────────
let WW,WH,gp=[],trees=[],flowers=[],decor=[],cottonP=[],parts=[];
let cam={x:0,y:0};
let OP={x:0,y:0,spd:2.6,f:1,sf:0,mov:false,chop:false,ct:0,alpha:1};
let collected=0,wood=0,cotton=0,WNEED=6;
let housePos={x:0,y:0},enterTimer=0,houseBuilt=false;

function rng(s){return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646;};}

function buildWorld(){
  W=C.width;H=C.height;WW=W*3;WH=H*3;
  OP.x=WW*.5;OP.y=WH*.52;housePos.x=WW*.5;housePos.y=WH*.42;
  const r=rng(77);
  gp=[];for(let i=0;i<700;i++)gp.push({x:r()*WW,y:r()*WH,rx:50+r()*110,ry:22+r()*52,col:`hsl(${316+r()*46},${56+r()*34}%,${58+r()*22}%)`,a:.15+r()*.25});
  trees=[];for(let i=0;i<65;i++){const tx=r()*WW,ty=r()*WH;if(Math.abs(tx-housePos.x)<165&&Math.abs(ty-housePos.y)<165)continue;trees.push({x:tx,y:ty,th:55+r()*70,tw:7+r()*6,L:[{r:28+r()*18,ox:0,oy:0,c:`hsl(${306+r()*34},${51+r()*24}%,${56+r()*22}%)`},{r:20+r()*14,ox:(r()-.5)*13,oy:-(16+r()*13),c:`hsl(${311+r()*32},${56+r()*24}%,${61+r()*19}%)`},{r:13+r()*10,ox:(r()-.5)*9,oy:-(30+r()*17),c:`hsl(${316+r()*28},${61+r()*19}%,${66+r()*17}%)`}],sha:.12+r()*.1,chopped:false,cp:0,shake:0});}
  cottonP=[];const rc=rng(123);for(let i=0;i<40;i++){const cx=rc()*WW,cy=rc()*WH;if(Math.abs(cx-housePos.x)<155&&Math.abs(cy-housePos.y)<155)continue;cottonP.push({x:cx,y:cy,h:false,rt:0,bob:rc()*Math.PI*2});}
  const sp=[{x:.12,y:.12},{x:.88,y:.13},{x:.44,y:.07},{x:.71,y:.76},{x:.17,y:.79},{x:.83,y:.56},{x:.37,y:.63},{x:.61,y:.24}];
  flowers=[];const fr=rng(33);sp.forEach((p,i)=>flowers.push({x:p.x*WW,y:p.y*WH,hue:300+i*18,found:false,bob:i*.8,pet:5+Math.floor(fr()*3),sz:11+fr()*5}));
  decor=[];const rd=rng(55);for(let i=0;i<220;i++)decor.push({x:rd()*WW,y:rd()*WH,t:rd()<.5?'f':'b',hue:291+rd()*54,size:3+rd()*5,ang:rd()*Math.PI*2,bob:rd()*Math.PI*2});
}
buildWorld();

function wts(wx,wy){return{sx:wx-cam.x,sy:wy-cam.y};}
function sdark(h,c,l,a){return`hsla(${h},${c}%,${l}%,${a??1})`;}

// sky,ground,decor,cotton,tree,flower omitted for brevity - same as before
function drawSky(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#5a1040');g.addColorStop(.35,'#9a3070');g.addColorStop(.65,'#d070a0');g.addColorStop(1,'#f0a8c8');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  [{x:.15,y:.12,s:1},{x:.45,y:.08,s:1.3},{x:.75,y:.14,s:.9},{x:.9,y:.07,s:1.1}].forEach(c=>{const cx=c.x*W,cy=c.y*H+Math.sin(frame*.008+c.x)*4,cs=c.s;ctx.globalAlpha=.17;ctx.fillStyle='#ffd6ec';[[-40,0,55,28],[0,-12,45,22],[40,0,50,25],[80,5,40,20],[-20,10,35,18]].forEach(([ox,oy,rx,ry])=>{ctx.beginPath();ctx.ellipse(cx+ox*cs,cy+oy*cs,rx*cs,ry*cs,0,0,Math.PI*2);ctx.fill();});});ctx.globalAlpha=1;
  const sx=W*.8,sy=H*.1;const sg=ctx.createRadialGradient(sx,sy,0,sx,sy,55);sg.addColorStop(0,'rgba(255,240,200,.9)');sg.addColorStop(.5,'rgba(255,210,220,.5)');sg.addColorStop(1,'rgba(255,180,210,0)');ctx.fillStyle=sg;ctx.beginPath();ctx.arc(sx,sy,55,0,Math.PI*2);ctx.fill();const sg2=ctx.createRadialGradient(sx,sy,0,sx,sy,26);sg2.addColorStop(0,'rgba(255,255,230,1)');sg2.addColorStop(1,'rgba(255,230,200,.7)');ctx.fillStyle=sg2;ctx.beginPath();ctx.arc(sx,sy,26,0,Math.PI*2);ctx.fill();
}
function drawGround(){
  const gg=ctx.createLinearGradient(0,H*.52,0,H);gg.addColorStop(0,'#f2b8d4');gg.addColorStop(.4,'#e8a0c2');gg.addColorStop(1,'#d888b0');ctx.fillStyle=gg;ctx.fillRect(0,H*.5,W,H*.5);
  ctx.save();gp.forEach(p=>{const{sx,sy}=wts(p.x,p.y);if(sx<-200||sx>W+200||sy<-120||sy>H+120)return;ctx.globalAlpha=p.a;ctx.fillStyle=p.col;ctx.beginPath();ctx.ellipse(sx,sy,p.rx,p.ry,0,0,Math.PI*2);ctx.fill();});ctx.globalAlpha=1;ctx.restore();
  const hg=ctx.createLinearGradient(0,H*.48,0,H*.57);hg.addColorStop(0,'rgba(210,120,170,0)');hg.addColorStop(.4,'rgba(240,160,200,.55)');hg.addColorStop(1,'rgba(200,100,150,0)');ctx.fillStyle=hg;ctx.fillRect(0,H*.48,W,H*.09);
}
function drawDecor(){decor.forEach(d=>{const{sx,sy}=wts(d.x,d.y);if(sx<-20||sx>W+20||sy<-20||sy>H+20)return;if(d.t==='f'){const bob=Math.sin(frame*.04+d.bob)*2;ctx.save();ctx.translate(sx,sy+bob);ctx.fillStyle=`hsla(${d.hue},70%,72%,.75)`;for(let i=0;i<5;i++){const a=i/5*Math.PI*2;ctx.beginPath();ctx.ellipse(Math.cos(a)*d.size*.7,Math.sin(a)*d.size*.7,d.size*.44,d.size*.7,a,0,Math.PI*2);ctx.fill();}ctx.fillStyle='rgba(255,240,250,.9)';ctx.beginPath();ctx.arc(0,0,d.size*.34,0,Math.PI*2);ctx.fill();ctx.restore();}else{ctx.save();ctx.translate(sx,sy);ctx.rotate(d.ang*.3+Math.sin(frame*.03+d.bob)*.15);ctx.fillStyle=`hsla(${d.hue},55%,65%,.55)`;ctx.beginPath();ctx.moveTo(-1.5,0);ctx.lineTo(0,-d.size*2.5);ctx.lineTo(1.5,0);ctx.fill();ctx.restore();}});}
function drawCotton(p){const{sx,sy}=wts(p.x,p.y);if(sx<-40||sx>W+40||sy<-40||sy>H+40)return;const bob=Math.sin(frame*.04+p.bob)*2;ctx.strokeStyle='#6a8040';ctx.lineWidth=2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(sx,sy+8+bob);ctx.lineTo(sx,sy-18+bob);ctx.stroke();ctx.beginPath();ctx.moveTo(sx,sy-8+bob);ctx.lineTo(sx-12,sy-18+bob);ctx.stroke();ctx.beginPath();ctx.moveTo(sx,sy-8+bob);ctx.lineTo(sx+12,sy-18+bob);ctx.stroke();if(!p.h){[[sx-12,sy-20+bob],[sx+12,sy-20+bob],[sx,sy-22+bob]].forEach(([bx,by])=>{ctx.fillStyle='rgba(255,255,255,.85)';for(let i=0;i<4;i++){const a=i/4*Math.PI*2;ctx.beginPath();ctx.arc(bx+Math.cos(a)*3.5,by+Math.sin(a)*3.5,4,0,Math.PI*2);ctx.fill();}ctx.fillStyle='rgba(255,252,250,1)';ctx.beginPath();ctx.arc(bx,by,3.5,0,Math.PI*2);ctx.fill();});ctx.save();ctx.globalAlpha=.13;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(sx,sy-18+bob,20,0,Math.PI*2);ctx.fill();ctx.restore();}}
function drawTree(t){if(t.chopped)return;const{sx,sy}=wts(t.x,t.y);if(sx<-150||sx>W+150||sy<-200||sy>H+100)return;const shk=t.shake*Math.sin(frame*.5)*3;ctx.save();ctx.translate(sx+shk,sy);ctx.save();ctx.globalAlpha=t.sha;ctx.fillStyle='#3a1020';ctx.beginPath();ctx.ellipse(0,0,t.tw*3,t.tw*.85,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.restore();const tg=ctx.createLinearGradient(-t.tw,0,t.tw,0);tg.addColorStop(0,'#2a1015');tg.addColorStop(.4,'#4a2030');tg.addColorStop(1,'#3a1525');ctx.fillStyle=tg;ctx.beginPath();ctx.moveTo(-t.tw*.5,0);ctx.bezierCurveTo(-t.tw*.6,-t.th*.4,-t.tw*.4,-t.th*.7,-t.tw*.3,-t.th);ctx.lineTo(t.tw*.3,-t.th);ctx.bezierCurveTo(t.tw*.4,-t.th*.7,t.tw*.6,-t.th*.4,t.tw*.5,0);ctx.fill();if(t.cp>0){ctx.fillStyle='rgba(255,200,150,.75)';ctx.fillRect(-t.tw*.5,-13,t.tw*t.cp*2,5);}t.L.forEach(l=>{const lx=l.ox,ly=-t.th+l.oy;ctx.save();ctx.globalAlpha=.1;ctx.fillStyle='#1a0010';ctx.beginPath();ctx.ellipse(lx+5,ly+7,l.r,l.r*.7,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.restore();ctx.fillStyle=l.c;ctx.beginPath();ctx.arc(lx,ly,l.r,0,Math.PI*2);ctx.fill();ctx.save();ctx.globalAlpha=.17;ctx.fillStyle='#fff0f8';ctx.beginPath();ctx.ellipse(lx-l.r*.2,ly-l.r*.25,l.r*.48,l.r*.33,-.5,0,Math.PI*2);ctx.fill();ctx.restore();});ctx.restore();}
function drawFlower(f){if(f.found)return;const{sx,sy}=wts(f.x,f.y);if(sx<-40||sx>W+40||sy<-40||sy>H+40)return;const bob=Math.sin(frame*.05+f.bob)*3,fy=sy+bob;ctx.strokeStyle='#7a4060';ctx.lineWidth=2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(sx,fy+f.sz*.8);ctx.bezierCurveTo(sx+3,fy+f.sz*.4,sx-2,fy,sx,fy);ctx.stroke();for(let i=0;i<f.pet;i++){const a=(i/f.pet)*Math.PI*2+frame*.007,px=Math.cos(a)*f.sz*.9,py=Math.sin(a)*f.sz*.9;const pg=ctx.createRadialGradient(sx+px*.6,fy+py*.6,0,sx+px,fy+py,f.sz*.75);pg.addColorStop(0,`hsl(${f.hue+15},85%,82%)`);pg.addColorStop(1,`hsl(${f.hue-10},75%,62%)`);ctx.fillStyle=pg;ctx.beginPath();ctx.ellipse(sx+px,fy+py,f.sz*.53,f.sz*.78,a,0,Math.PI*2);ctx.fill();}const cg=ctx.createRadialGradient(sx,fy,0,sx,fy,f.sz*.43);cg.addColorStop(0,'#fff8fc');cg.addColorStop(1,'#ffd0e8');ctx.fillStyle=cg;ctx.beginPath();ctx.arc(sx,fy,f.sz*.43,0,Math.PI*2);ctx.fill();}

function drawHouse(hx,hy){
  if(!houseBuilt)return;
  ctx.save();ctx.save();ctx.globalAlpha=.14;ctx.fillStyle='#1a0010';ctx.beginPath();ctx.ellipse(hx,hy+5,70,16,0,0,Math.PI*2);ctx.fill();ctx.restore();
  ctx.fillStyle='#a06078';ctx.beginPath();ctx.roundRect(hx-65,hy-6,130,16,4);ctx.fill();
  const wg=ctx.createLinearGradient(hx-60,hy-82,hx+60,hy);wg.addColorStop(0,'#f8c8de');wg.addColorStop(1,'#e8a8c4');ctx.fillStyle=wg;ctx.beginPath();ctx.roundRect(hx-60,hy-82,120,80,5);ctx.fill();
  ctx.save();ctx.globalAlpha=.13;ctx.fillStyle='#fff0f8';ctx.beginPath();ctx.roundRect(hx-55,hy-77,26,68,3);ctx.fill();ctx.restore();
  ctx.fillStyle='#7a3050';ctx.beginPath();ctx.roundRect(hx-15,hy-64,30,58,6);ctx.fill();ctx.fillStyle='#9a4060';ctx.beginPath();ctx.roundRect(hx-13,hy-62,13,52,3);ctx.fill();ctx.fillStyle='#b05070';ctx.beginPath();ctx.roundRect(hx,hy-62,13,52,3);ctx.fill();ctx.fillStyle='#ffd6ec';ctx.beginPath();ctx.arc(hx+11,hy-34,2.5,0,Math.PI*2);ctx.fill();
  [[hx-45,hy-74],[hx+22,hy-74]].forEach(([wx,wy])=>{ctx.fillStyle='#7a3050';ctx.beginPath();ctx.roundRect(wx,wy,26,22,3);ctx.fill();ctx.fillStyle='rgba(180,220,255,.3)';ctx.beginPath();ctx.roundRect(wx+2,wy+2,22,18,2);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.22)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(wx+13,wy+2);ctx.lineTo(wx+13,wy+20);ctx.stroke();ctx.beginPath();ctx.moveTo(wx+2,wy+11);ctx.lineTo(wx+24,wy+11);ctx.stroke();});
  ctx.fillStyle='#8a2050';ctx.beginPath();ctx.moveTo(hx-68,hy-80);ctx.lineTo(hx,hy-128);ctx.lineTo(hx+68,hy-80);ctx.fill();ctx.save();ctx.globalAlpha=.17;ctx.fillStyle='#ff88bb';ctx.beginPath();ctx.moveTo(hx-22,hy-80);ctx.lineTo(hx,hy-128);ctx.lineTo(hx+12,hy-92);ctx.lineTo(hx-14,hy-80);ctx.fill();ctx.restore();ctx.strokeStyle='#c04080';ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(hx-68,hy-80);ctx.lineTo(hx,hy-128);ctx.lineTo(hx+68,hy-80);ctx.stroke();
  ctx.fillStyle='#7a2848';ctx.beginPath();ctx.roundRect(hx+24,hy-126,16,34,2);ctx.fill();for(let i=0;i<3;i++){const sf=((frame*.02+i*.4)%1);ctx.save();ctx.globalAlpha=(1-sf)*.22;ctx.fillStyle='#ffccdd';ctx.beginPath();ctx.arc(hx+32+(i-1)*4,hy-126-sf*30,4+sf*8,0,Math.PI*2);ctx.fill();ctx.restore();}
  // enter hint
  if(phase==='outside_gather'&&Math.hypot(OP.x-housePos.x,OP.y-housePos.y)<110){
    const{sx,sy}=wts(housePos.x,housePos.y-95);ctx.fillStyle='rgba(255,220,240,.85)';ctx.font='bold 11px Georgia';ctx.textAlign='center';ctx.fillText('SPACE to enter',sx,sy);ctx.textAlign='left';
  }
  ctx.restore();
}
// ── CHARACTER ─────────────────────────────────────────
function drawChar(sx,sy,fac,mov,sf,chop,ct,al){
  ctx.save();ctx.globalAlpha=al??1;
  const f=fac,t=sf,LL=13,hx=sx,hy=sy-5;
  const la=mov?Math.sin(t)*.4:0,ra=mov?Math.sin(t+Math.PI)*.4:0;
  const lEx=hx-2+Math.sin(la)*LL*f,lEy=hy+Math.cos(Math.abs(la))*LL,rEx=hx+2+Math.sin(ra)*LL*f,rEy=hy+Math.cos(Math.abs(ra))*LL;
  const leg=(ex,ey,sh)=>{ctx.strokeStyle=sh;ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(hx,hy);ctx.lineTo(ex,ey);ctx.stroke();ctx.fillStyle='#c04070';ctx.beginPath();ctx.ellipse(ex,ey+2,4.5,2.5,0,0,Math.PI*2);ctx.fill();};
  la<ra?(leg(rEx,rEy,'#c09080'),leg(lEx,lEy,'#f0c0a8')):(leg(lEx,lEy,'#c09080'),leg(rEx,rEy,'#f0c0a8'));
  // skirt
  const sw=mov?Math.sin(t)*.033:0;const sg=ctx.createLinearGradient(sx-14,sy-10,sx+14,sy+4);sg.addColorStop(0,'#e870b0');sg.addColorStop(.5,'#d45090');sg.addColorStop(1,'#b83878');ctx.fillStyle=sg;ctx.save();ctx.translate(sx,sy-12);ctx.rotate(sw);ctx.beginPath();ctx.moveTo(-7,0);ctx.bezierCurveTo(-9,5,-14,11,-13,15);ctx.lineTo(13,15);ctx.bezierCurveTo(14,11,9,5,7,0);ctx.fill();ctx.strokeStyle='rgba(255,200,230,.4)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-13,14);ctx.lineTo(13,14);ctx.stroke();ctx.save();ctx.globalAlpha=.17;ctx.fillStyle='#fff0f8';ctx.beginPath();ctx.moveTo(-3,0);ctx.bezierCurveTo(-5,4,-7,9,-6,13);ctx.lineTo(-2,13);ctx.bezierCurveTo(-3,7,-1,3,0,0);ctx.fill();ctx.restore();ctx.restore();
  // bodice

// ── PARTICLES ─────────────────────────────────────────
function spawnChop(wx,wy){for(let i=0;i<10;i++){const a=Math.random()*Math.PI*2,sp=1+Math.random()*3;parts.push({x:wx,y:wy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,life:1,ml:28+Math.random()*18,col:Math.random()>.5?'#c08060':'#a06040',sz:3+Math.random()*4});}}
function spawnCotton(wx,wy){for(let i=0;i<8;i++){const a=Math.random()*Math.PI*2,sp=.5+Math.random()*1.5;parts.push({x:wx,y:wy-10,vx:Math.cos(a)*sp,vy:-1-Math.random()*2,life:1,ml:40+Math.random()*20,col:'rgba(255,255,252,.9)',sz:2+Math.random()*3});}}
function tickParts(){parts=parts.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.1;p.life-=1/p.ml;return p.life>0;});}
function drawParts(){parts.forEach(p=>{const{sx,sy}=wts(p.x,p.y);ctx.save();ctx.globalAlpha=p.life;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(sx,sy,p.sz,0,Math.PI*2);ctx.fill();ctx.restore();});}

// ── CRAFT PANEL ───────────────────────────────────────
function refreshMats(){document.getElementById('mats').textContent=`🪵 ${wood} wood · 🌿 ${cotton} cotton`;}
function buildCatRow(){
  const cr=document.getElementById('cat-row');cr.innerHTML='';
  const rb=document.createElement('button');rb.className='cat-btn'+(craftCat===-1?' on':'');rb.textContent='📍 This Room';rb.onclick=()=>{craftCat=-1;buildItemRow();buildCatRow();};cr.appendChild(rb);
  CATS.forEach((c,i)=>{const b=document.createElement('button');b.className='cat-btn'+(craftCat===i?' on':'');b.textContent=c;b.onclick=()=>{craftCat=i;buildItemRow();buildCatRow();};cr.appendChild(b);});
}
function buildItemRow(){
  const ir=document.getElementById('items-row');ir.innerHTML='';
  let list=craftCat===-1?FURN.filter(f=>f.room===ROOMS[curRoom].id):FURN.filter(f=>f.cat===craftCat);
  list.forEach(def=>{
    const isPlaced=placed.some(p=>p.id===def.id);
    const isSel=selDef&&selDef.id===def.id;
    const canAfford=wood>=def.cost.w&&cotton>=def.cost.c;
    const btn=document.createElement('button');
    let cs=[];if(def.cost.w>0)cs.push(`${def.cost.w}🪵`);if(def.cost.c>0)cs.push(`${def.cost.c}🌿`);if(!cs.length)cs.push('free');
    btn.textContent=`${def.name} (${cs.join('+')})`+(isPlaced?' ✓':'');
    btn.className='item-btn'+(isSel?' sel':(!canAfford||isPlaced)?' dim':'');
    if(!isPlaced&&canAfford)btn.onclick=()=>{selDef=def;movPiece=null;buildItemRow();};
    ir.appendChild(btn);
  });
}
function showCraftPanel(){document.getElementById('craft-wrap').style.display='flex';refreshMats();buildCatRow();buildItemRow();}

// ── INSIDE LOGIC ──────────────────────────────────────
function updateInside(){
  let dx=0,dy=0;
  if(keys['ArrowLeft']||keys['a']||keys['A'])dx=-1;if(keys['ArrowRight']||keys['d']||keys['D'])dx=1;
  if(keys['ArrowUp']||keys['w']||keys['W'])dy=-1;if(keys['ArrowDown']||keys['s']||keys['S'])dy=1;
  if(dx&&dy){dx*=.707;dy*=.707;}
  IP.mov=!!(dx||dy);
  if(IP.mov){IP.x=Math.max(22,Math.min(RW-22,IP.x+dx*2.3));IP.y=Math.max(62,Math.min(RH-18,IP.y+dy*2.3));if(dx)IP.f=dx>0?1:-1;IP.sf+=.18;}
  // room change via doorways
  const dz=IP.y>RH*.55&&IP.y<RH*.9;
  if(dz&&IP.x<22&&curRoom>0){curRoom--;IP.x=RW-30;onRoomChange();}
  if(dz&&IP.x>RW-22&&curRoom<ROOMS.length-1){curRoom++;IP.x=30;onRoomChange();}
}
function onRoomChange(){
  document.getElementById('room-badge').textContent=ROOMS[curRoom].name;
  document.getElementById('nav-l').disabled=curRoom===0;
  document.getElementById('nav-r').disabled=curRoom===ROOMS.length-1;
  selDef=null;movPiece=null;buildItemRow();buildCatRow();
}

function placeOrMove(){
  const{ox,oy}=getRO();
  const gx=Math.max(ox+56,Math.min(ox+RW-56,mouse.x));
  const gy=Math.max(oy+64,Math.min(oy+RH-22,mouse.y));
  if(insideMode==='craft'&&selDef){
    wood-=selDef.cost.w;cotton-=selDef.cost.c;
    placed.push({id:selDef.id,room:ROOMS[curRoom].id,rx:gx-ox,ry:gy-oy});
    selDef=null;refreshMats();buildItemRow();
    document.getElementById('counter').textContent=`🪵 ${wood} · 🌿 ${cotton}`;
  } else if(insideMode==='move'&&movPiece){
    movPiece.rx=gx-ox;movPiece.ry=gy-oy;movPiece=null;buildItemRow();
  }
}

function renderInside(){
  ctx.fillStyle='#140008';ctx.fillRect(0,0,W,H);
  drawRoomBase(curRoom);
  const{ox,oy}=getRO();
  const rp=placed.filter(p=>p.room===ROOMS[curRoom].id).sort((a,b)=>a.ry-b.ry);
  rp.forEach(p=>{
    const isMoving=movPiece===p;
    drawFurn(p.id,p.rx+ox,p.ry+oy,false,isMoving);
    if(insideMode==='delete'){
      ctx.save();ctx.fillStyle='rgba(220,40,40,.88)';ctx.beginPath();ctx.arc(p.rx+ox+46,p.ry+oy-52,9,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 11px Georgia';ctx.textAlign='center';ctx.fillText('✕',p.rx+ox+46,p.ry+oy-48);ctx.textAlign='left';ctx.restore();
    }
  });
  // ghost
  const{ox:gox,oy:goy}=getRO();
  const gx=Math.max(gox+56,Math.min(gox+RW-56,mouse.x));
  const gy=Math.max(goy+64,Math.min(goy+RH-22,mouse.y));
  if(insideMode==='craft'&&selDef){drawFurn(selDef.id,gx,gy,true,false);ctx.fillStyle='rgba(255,80,80,.8)';ctx.font='10px Georgia';ctx.textAlign='center';ctx.fillText('SPACE/click to place',gx,gy+58);ctx.textAlign='left';}
  if(insideMode==='move'&&movPiece){drawFurn(movPiece.id,gx,gy,true,false);ctx.fillStyle='rgba(255,200,80,.85)';ctx.font='10px Georgia';ctx.textAlign='center';ctx.fillText('SPACE/click to place here',gx,gy+58);ctx.textAlign='left';}
  drawChar(IP.x+gox,IP.y+goy,IP.f,IP.mov,IP.sf,false,0,1);
  const vig=ctx.createRadialGradient(W/2,H/2,Math.min(RW,RH)*.33,W/2,H/2,Math.max(W,H)*.62);
  vig.addColorStop(0,'rgba(0,0,0,0)');vig.addColorStop(1,'rgba(6,0,3,.7)');ctx.fillStyle=vig;ctx.fillRect(0,0,W,H);
}

// ── OUTSIDE LOGIC ─────────────────────────────────────
function updateCam(){const tx=OP.x-W/2,ty=OP.y-H/2;cam.x+=(Math.max(0,Math.min(WW-W,tx))-cam.x)*.1;cam.y+=(Math.max(0,Math.min(WH-H,ty))-cam.y)*.1;}
function checkCollect(){
  if(phase!=='flowers')return;
  flowers.forEach(f=>{if(f.found)return;if(Math.hypot(OP.x-f.x,OP.y-f.y)<26){f.found=true;collected++;document.getElementById('counter').textContent=`🌸 ${collected}/8`;if(collected>=8)setTimeout(()=>{phase='chop_for_house';setMsg(`All flowers found! Chop ${WNEED} trees (SPACE near tree) + harvest cotton plants to build the house.`);document.getElementById('counter').textContent=`🪵 0/${WNEED} · 🌿 0`;},400);}});
}
function setMsg(t){const e=document.getElementById('msg');e.style.display='block';e.textContent=t;}
function refreshBar(){if(phase==='chop_for_house')document.getElementById('counter').textContent=`🪵 ${wood}/${WNEED} · 🌿 ${cotton}`;else document.getElementById('counter').textContent=`🪵 ${wood} · 🌿 ${cotton}`;}

function nearT(){let b=null,d=Infinity;trees.forEach(t=>{if(t.chopped)return;const dd=Math.hypot(OP.x-t.x,OP.y-t.y);if(dd<d){d=dd;b=t;}});return d<90?b:null;}
function nearC(){let b=null,d=Infinity;cottonP.forEach(p=>{if(p.h)return;const dd=Math.hypot(OP.x-p.x,OP.y-p.y);if(dd<d){d=dd;b=p;}});return d<70?b:null;}

function doChopHarvest(){
  if(phase!=='chop_for_house'&&phase!=='outside_gather')return;
  if(!keys[' ']&&!keys['Space']){OP.chop=false;OP.ct=0;return;}
  // enter house check
  if(phase==='outside_gather'&&houseBuilt&&Math.hypot(OP.x-housePos.x,OP.y-housePos.y)<110){enterAnim();return;}
  const cp=nearC(),tr=nearT();
  const dc=cp?Math.hypot(OP.x-cp.x,OP.y-cp.y):Infinity;
  const dt=tr?Math.hypot(OP.x-tr.x,OP.y-tr.y):Infinity;
  if(cp&&dc<=dt&&dc<70){OP.chop=false;cp.h=true;cotton++;spawnCotton(cp.x,cp.y);cp.rt=600;refreshBar();return;}
  if(!tr)return;
  OP.chop=true;OP.ct++;tr.shake=1;
  if(OP.ct%14===0){tr.cp+=0.35;spawnChop(tr.x,tr.y-tr.th*.3);if(tr.cp>=1){tr.chopped=true;tr.shake=0;wood++;refreshBar();if(phase==='chop_for_house'&&wood>=WNEED){houseBuilt=true;phase='outside_gather';setMsg('House built! Walk to the door and press SPACE to enter. Keep gathering wood 🪵 and cotton 🌿 for furniture!');refreshBar();}}}
}
function enterAnim(){
  phase='entering';enterTimer=0;OP.chop=false;OP.ct=0;
}
function updateEntering(){
  const dx=housePos.x-OP.x,dy=(housePos.y-8)-OP.y,dist=Math.hypot(dx,dy);
  if(dist>4){const sp=2.4;OP.x+=dx/dist*sp;OP.y+=dy/dist*sp;OP.f=dx>0?1:-1;OP.mov=true;OP.sf+=.17;}
  else{OP.mov=false;enterTimer++;OP.alpha=Math.max(0,1-enterTimer/28);if(enterTimer>36)goInside();}
  updateCam();
}
function goInside(){
  phase='inside';IP.x=RW/2;IP.y=RH-55;IP.f=1;IP.mov=false;curRoom=0;
  document.getElementById('counter').textContent=`🪵 ${wood} · 🌿 ${cotton}`;
  document.getElementById('msg').style.display='none';
  document.getElementById('inside-ui').style.display='block';
  onRoomChange();showCraftPanel();
}
function exitHouse(){
  phase='outside_gather';OP.alpha=1;enterTimer=0;
  document.getElementById('inside-ui').style.display='none';
  document.getElementById('craft-wrap').style.display='none';
  selDef=null;movPiece=null;insideMode='craft';
  setMode('craft');
  setMsg('Gather more 🪵 wood and 🌿 cotton, then walk to the door and press SPACE to re-enter.');
  refreshBar();
}

function setMode(m){
  insideMode=m;selDef=null;movPiece=null;
  ['craft','move','del'].forEach(id=>document.getElementById('mode-'+id).classList.toggle('active',id===m||(m==='delete'&&id==='del')));
  document.getElementById('craft-wrap').style.display=m==='craft'?'flex':'none';
  if(m==='move'){buildItemRow();}
}

function renderOutside(){
  ctx.clearRect(0,0,W,H);drawSky();drawGround();drawDecor();
  cottonP.forEach(drawCotton);
  const allO=[...trees.filter(t=>!t.chopped),...flowers.filter(f=>!f.found),{x:housePos.x,y:housePos.y,_h:true}].sort((a,b)=>a.y-b.y);
  let pd=false;
  allO.forEach(o=>{
    if(!pd&&OP.y<=o.y){const{sx,sy}=wts(OP.x,OP.y);drawChar(sx,sy,OP.f,OP.mov,OP.sf,OP.chop,OP.ct,OP.alpha);pd=true;}
    if(o._h){const{sx,sy}=wts(o.x,o.y);drawHouse(sx,sy);}else if(o.pet!==undefined)drawFlower(o);else drawTree(o);
  });
  if(!pd){const{sx,sy}=wts(OP.x,OP.y);drawChar(sx,sy,OP.f,OP.mov,OP.sf,OP.chop,OP.ct,OP.alpha);}
  if(phase==='entering'&&enterTimer>16){ctx.fillStyle=`rgba(20,0,10,${Math.min(1,(enterTimer-16)/20)})`;ctx.fillRect(0,0,W,H);}
  drawParts();
  // hints
  if(phase==='chop_for_house'||phase==='outside_gather'){
    const nt=nearT();if(nt){const{sx,sy}=wts(nt.x,nt.y-nt.th*.5);ctx.save();ctx.globalAlpha=.7+Math.sin(frame*.1)*.3;ctx.fillStyle='#ffe0c0';ctx.font='bold 11px Georgia';ctx.textAlign='center';ctx.fillText('SPACE to chop',sx,sy-16);ctx.textAlign='left';ctx.restore();}
    const nc=nearC();if(nc){const{sx,sy}=wts(nc.x,nc.y-20);ctx.save();ctx.globalAlpha=.7+Math.sin(frame*.1)*.3;ctx.fillStyle='#e0ffe0';ctx.font='bold 11px Georgia';ctx.textAlign='center';ctx.fillText('SPACE to harvest',sx,sy-16);ctx.textAlign='left';ctx.restore();}
  }
  const vig=ctx.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.82);vig.addColorStop(0,'rgba(0,0,0,0)');vig.addColorStop(1,'rgba(28,0,14,.48)');ctx.fillStyle=vig;ctx.fillRect(0,0,W,H);
}

// ── MAIN LOOP ─────────────────────────────────────────
function updateOutside(){
  let dx=0,dy=0;if(keys['ArrowLeft']||keys['a']||keys['A'])dx=-1;if(keys['ArrowRight']||keys['d']||keys['D'])dx=1;if(keys['ArrowUp']||keys['w']||keys['W'])dy=-1;if(keys['ArrowDown']||keys['s']||keys['S'])dy=1;if(dx&&dy){dx*=.707;dy*=.707;}
  OP.mov=!!(dx||dy);if(OP.mov){OP.x=Math.max(15,Math.min(WW-15,OP.x+dx*OP.spd));OP.y=Math.max(30,Math.min(WH-15,OP.y+dy*OP.spd));if(dx)OP.f=dx>0?1:-1;OP.sf+=.18;}
  trees.forEach(t=>{if(t.shake>0)t.shake=Math.max(0,t.shake-.05);});cottonP.forEach(p=>{if(p.h&&p.rt>0){p.rt--;if(!p.rt)p.h=false;}});
  tickParts();updateCam();checkCollect();doChopHarvest();
}

function loop(){
  if(won)return;frame++;
  if(phase==='inside'){updateInside();renderInside();}
  else if(phase==='entering'){updateEntering();renderOutside();}
  else{updateOutside();renderOutside();}
  requestAnimationFrame(loop);
}

// ── EVENTS ────────────────────────────────────────────
addEventListener('keydown',e=>{
  keys[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
  if(e.key===' '&&phase==='inside'){
    if(insideMode==='craft'&&selDef)placeOrMove();
    else if(insideMode==='move'&&movPiece)placeOrMove();
  }
  if(e.key==='Escape'&&phase==='inside'){selDef=null;movPiece=null;buildItemRow();}
});
addEventListener('keyup',e=>keys[e.key]=false);
addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;});
C.addEventListener('click',e=>{
  mouse.x=e.clientX;mouse.y=e.clientY;
  if(phase!=='inside')return;
  if(insideMode==='craft'&&selDef){placeOrMove();return;}
  if(insideMode==='move'){
    if(movPiece){placeOrMove();return;}
    const{ox,oy}=getRO();const rp=placed.filter(p=>p.room===ROOMS[curRoom].id);
    for(let i=rp.length-1;i>=0;i--){const p=rp[i];if(Math.abs(e.clientX-(p.rx+ox))<54&&Math.abs(e.clientY-(p.ry+oy))<58){movPiece=p;buildItemRow();return;}}
    return;
  }
  if(insideMode==='delete'){
    const{ox,oy}=getRO();const rp=placed.filter(p=>p.room===ROOMS[curRoom].id);
    for(let i=rp.length-1;i>=0;i--){const p=rp[i];const bx=p.rx+ox+46,by=p.ry+oy-52;if(Math.hypot(e.clientX-bx,e.clientY-by)<14){
      // refund materials
      const def=FURN.find(f=>f.id===p.id);if(def){wood+=def.cost.w;cotton+=def.cost.c;}
      placed.splice(placed.indexOf(p),1);refreshMats();refreshBar();buildItemRow();
      document.getElementById('counter').textContent=`🪵 ${wood} · 🌿 ${cotton}`;return;}}
  }
});
// NAV BUTTONS
document.getElementById('nav-l').addEventListener('click',()=>{if(curRoom>0){curRoom--;IP.x=RW-40;onRoomChange();}});
document.getElementById('nav-r').addEventListener('click',()=>{if(curRoom<ROOMS.length-1){curRoom++;IP.x=40;onRoomChange();}});
// MODE BUTTONS
document.getElementById('mode-craft').addEventListener('click',()=>setMode('craft'));
document.getElementById('mode-move').addEventListener('click',()=>setMode('move'));
document.getElementById('mode-del').addEventListener('click',()=>{setMode('delete');});
document.getElementById('exit-btn').addEventListener('click',exitHouse);
// Touch
let lt=null;
C.addEventListener('touchstart',e=>{lt=e.touches[0];mouse.x=lt.clientX;mouse.y=lt.clientY;e.preventDefault();},{passive:false});
C.addEventListener('touchmove',e=>{if(!lt)return;const t=e.touches[0];mouse.x=t.clientX;mouse.y=t.clientY;if(phase==='inside'){IP.x=Math.max(22,Math.min(RW-22,IP.x+(t.clientX-lt.clientX)*.5));IP.y=Math.max(62,Math.min(RH-18,IP.y+(t.clientY-lt.clientY)*.5));IP.mov=true;IP.sf+=.18;}else{OP.x=Math.max(15,Math.min(WW-15,OP.x+(t.clientX-lt.clientX)*.55));OP.y=Math.max(30,Math.min(WH-15,OP.y+(t.clientY-lt.clientY)*.55));OP.mov=true;OP.sf+=.18;}lt=t;e.preventDefault();},{passive:false});
C.addEventListener('touchend',e=>{if(phase==='inside'&&(selDef||movPiece))placeOrMove();lt=null;OP.mov=false;IP.mov=false;});
document.getElementById('play-again').addEventListener('click',()=>{
  phase='flowers';collected=0;wood=0;cotton=0;won=false;frame=0;enterTimer=0;houseBuilt=false;
  OP.alpha=1;OP.mov=false;OP.chop=false;OP.sf=0;
  placed=[];selDef=null;movPiece=null;insideMode='craft';
  parts=[];
  document.getElementById('counter').textContent='🌸 0/8';document.getElementById('msg').style.display='none';
  document.getElementById('inside-ui').style.display='none';document.getElementById('win').style.display='none';
  buildWorld();loop();
});
loop();
</script></body></html>
